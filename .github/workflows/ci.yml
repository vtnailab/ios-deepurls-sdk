# CI — Build and Test
#
# Validates the Swift package on every pull request targeting main and on
# pushes to main.  Uses read-only permissions and never creates tags or
# releases.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Validate package manifest
        run: swift package dump-package

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
